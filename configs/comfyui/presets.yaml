# ComfyUI presets for ViMax generators.
# Select with model: comfyui/<preset-name> and point base_url at the ComfyUI root
# (e.g. http://127.0.0.1:18188).
#
# values:      inputs merged over the workflow's {{placeholders}} alongside
#              prompt/seed/width/height (image) or prompt/seed/length (video).
# workflow:    API-format graph JSON in this directory.
# reference_chain (image only): describes how reference images are wired in.
#   vae:    link ([node_id, output_index]) to the VAE output used by VAEEncode.
#   targets: conditioning inputs ([node_id, input_name]) that get wrapped in a
#            ReferenceLatent chain, one node per reference image.
#   megapixels: passed to ImageScaleToTotalPixels for each reference image.
# optional_inputs: input names that may be dropped (instead of cascade-deleting
#   their node) when the node feeding them was removed by an unfilled placeholder.
presets:
  # FLUX.2 [klein] 4B (distilled) — Apache-2.0 weights.
  flux2-klein-4b:
    kind: image
    workflow: flux2-klein.json
    max_reference_images: 4
    values:
      unet_name: flux-2-klein-4b.safetensors
      clip_name: qwen_3_4b.safetensors
      vae_name: flux2-vae.safetensors
      steps: 4
      cfg: 1.0
    reference_chain:
      vae: ["3", 0]
      targets: [["6", "positive"]]
      megapixels: 1.0

  # FLUX.2 [klein] 9B — non-commercial licence.
  flux2-klein-9b:
    kind: image
    workflow: flux2-klein.json
    max_reference_images: 4
    values:
      unet_name: flux-2-klein-9b-fp8.safetensors
      clip_name: qwen_3_8b.safetensors
      vae_name: flux2-vae.safetensors
      steps: 4
      cfg: 1.0
    reference_chain:
      vae: ["3", 0]
      targets: [["6", "positive"]]
      megapixels: 1.0

  # Example LoRA preset: copy a klein preset, switch the workflow to the
  # variant that contains a LoraLoaderModelOnly node, and add lora values.
  # The .safetensors file goes into ComfyUI/models/loras.
  # flux2-klein-4b-mylora:
  #   kind: image
  #   workflow: flux2-klein-lora.json
  #   max_reference_images: 4
  #   values:
  #     unet_name: flux-2-klein-4b.safetensors
  #     clip_name: qwen_3_4b.safetensors
  #     vae_name: flux2-vae.safetensors
  #     steps: 4
  #     cfg: 1.0
  #     lora_name: my_lora.safetensors
  #     lora_strength: 1.0
  #   reference_chain:
  #     vae: ["3", 0]
  #     targets: [["6", "positive"]]
  #     megapixels: 1.0

  # MiniMax-H3 image-to-video (also works with no frames as text-to-video).
  minimax-h3:
    kind: video
    workflow: minimax-h3-i2v.json
    values:
      unet_name: minimax_h3_fl2va_pruned_int8_convrot.safetensors
      clip_name: qwen3vl_32b_minimax_h3_nvfp4_awq.safetensors
      vae_name: minimax_h3_video_vae_int8_convrot.safetensors
      audio_vae_name: minimax_h3_audio_vae_fp32.safetensors
      width: 1344
      height: 768
      fps: 24
      steps: 20
    optional_inputs: [first_frame, last_frame]

  # MiniMax-H3 with the lightx2v 8-step turbo LoRA (faster, slightly lower quality).
  minimax-h3-turbo:
    kind: video
    workflow: minimax-h3-i2v-turbo.json
    values:
      unet_name: minimax_h3_fl2va_pruned_int8_convrot.safetensors
      clip_name: qwen3vl_32b_minimax_h3_nvfp4_awq.safetensors
      vae_name: minimax_h3_video_vae_int8_convrot.safetensors
      audio_vae_name: minimax_h3_audio_vae_fp32.safetensors
      lora_name: minimax_h3_fl2v_turbo_8step_v1.0_comfyui_bf16.safetensors
      lora_strength: 1.0
      width: 1344
      height: 768
      fps: 24
      steps: 8
    optional_inputs: [first_frame, last_frame]
